[package]
name = "emacs-i3"
version = "0.2.1"
edition = "2024"
rust-version = "1.85"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0"
clap = { version = "4.6.6", features = ["derive"] }
clap_complete = "4.6.9"
i3ipc = { package = "i3ipc-jl", version = "0.11.2", features = ["i3-4-14"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
socket2 = "0.6.5"
toml = "1.1.4"
