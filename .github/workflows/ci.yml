name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Emacs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends emacs-nox
      - name: Core qualification
        run: bash tests/run.sh
      - name: Release build
        run: cargo build --release --locked

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
      - name: Verify declared Rust 1.85 MSRV
        run: cargo check --locked --all-targets

  desktop-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install desktop test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            emacs-lucid i3-wm xterm x11-utils xvfb fonts-dejavu-core
      - name: Isolated desktop qualification
        run: bash tests/e2e-desktop.sh

  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Check and build flake
        run: nix flake check --print-build-logs
